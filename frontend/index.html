<!doctype html>
<html lang="es">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Promiedos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="dark">

      <h1>Mi Promiedos</h1>

        <button data-view="liga">Liga Profesional</button>
        <button data-view="apertura">Apertura</button>

      <input id="teamSearch" placeholder="Buscar equipo..." />

    <main class="content">

      <section id="fixtures"></section>

  </div>
  <script src="app.js"></script>

</html>
